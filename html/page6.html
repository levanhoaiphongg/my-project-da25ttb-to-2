<html lang="vi">
<head>
    <title>Hóa đơn mua hàng</title>
    <meta charset="UTF-8">
    <link rel ="stylesheet" href="../css/style03.css">
</head>
<body>

        <tr>

        </tr>

        <tr>

            <td  class="dongia">7000</td>
            <td>bịch</td>
            <td  class="thanhtien"></td>
        </tr>

        <tr>
            <td>3</td>
            <td  class="tenhang">gạo nếp</td>
            <td  class="soluong">10</td>
            <td  class="dongia">30000</td>
            <td>bao</td>
            <td  class="thanhtien"></td>
        </tr>

        <tr>
            <td>4</td>
            <td  class="tenhang">sữa ngô</td>
            <td  class="soluong">10</td>

            <td>bịch</td>
            <td  class="thanhtien"></td>
        </tr>

        <tr>
            <td>5</td>
            <td  class="tenhang">Sữa tắm</td>
            <td  class="soluong">10</td>

        </tr>

        <tr>
            <td>6</td>

        </tr>

        <tr>
            <td>7</td>

            <td  class="soluong">6</td>
            <td  class="dongia">10000</td>

        </tr>

        <tr>
            <td>8</td>

        <tr>

        </tr>

        <tr>
            <td>10</td>
            <td  class="tenhang">Bánh tráng trộn</td>
            <td  class="soluong">3</td>
            <td  class="dongia">15000</td>
            <td>Bịch</td>
            <td  class="thanhtien"></td>
        </tr>
    </table>
   <script>
    const sl = document.getElementsByClassName("soluong");
    const dg = document.getElementsByClassName("dongia");
    const tt = document.getElementsByClassName("thanhtien");

    let tongthanhtoan = 0;

    for(let i = 0; i < sl.length; i++)
     {
        let soluong = Number(sl[i].innerHTML);
        let dongia = Number(dg[i].innerHTML);

        let thanhtien = soluong * dongia;

        tt[i].innerHTML = thanhtien;

        tongthanhtoan += thanhtien;
     }

    document.write("<h2>Tổng thanh toán: " + tongthanhtoan + " VNĐ</h2>");
   </script>
 </body>
</html>
