<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Chi tiết sản phẩm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/detail.css">
    
</head>
<body>

<div class="container mt-4 text-center">
    <h2 id="name" class="text-danger fw-bold"></h2>

    <img id="img" class="img-fluid d-block mx-auto my-3 product-img">

    <h4 id="price" class="text-info fw-bold"></h4>

    <p id="desc" class="text-danger fs-5"></p>

</div>

<script>
const products = {
    oi: {
        name: "TRÁI ỔI",
        price: "250000đ",
        desc: "Ổi là loại trái cây nhiệt đới nổi bật với lớp vỏ xanh tươi, phần thịt giòn ngọt và hương thơm dịu nhẹ đặc trưng. Khi cắn vào, bạn sẽ cảm nhận được độ giòn mát tự nhiên cùng vị ngọt thanh xen lẫn chút chua nhẹ, tạo cảm giác sảng khoái và dễ chịu. Ổi rất giàu vitamin C, chất xơ và các chất chống oxy hóa, phù hợp cho những ai yêu thích lối sống lành mạnh và muốn bổ sung dinh dưỡng hằng ngày.",
        img: "../assets/images/oi.jpg"
    },
    man: {
        name: "TRÁI MẬN",
        price: "300000đ",
        desc: "Mận sở hữu lớp vỏ căng bóng với màu đỏ tím hấp dẫn, bên trong là phần thịt mọng nước, chua ngọt hài hòa. Hương vị tươi mát của mận giúp kích thích vị giác ngay từ lần thưởng thức đầu tiên. Với kết cấu giòn nhẹ hoặc mềm mọng tùy độ chín, loại quả này là lựa chọn lý tưởng cho những ngày hè nóng bức, đồng thời cung cấp nhiều vitamin và khoáng chất có lợi cho cơ thể.",
        img: "../assets/images/man.jpg"
    },
    dualuoi: {
        name: "TRÁI DƯA LƯỚI",
        price: "270000đ",
        desc: "Dưa lưới gây ấn tượng với lớp vỏ có các đường gân đan xen tự nhiên và phần ruột vàng cam hoặc xanh nhạt bắt mắt. Thịt quả mềm mọng, ngọt đậm nhưng thanh mát, lan tỏa hương thơm dịu dàng đặc trưng. Nhờ hàm lượng nước cao cùng nhiều vitamin A, vitamin C và khoáng chất thiết yếu, dưa lưới là món trái cây cao cấp được yêu thích trong các bữa ăn nhẹ và chế độ dinh dưỡng hiện đại.",
        img: "../assets/images/dualuoi.jpg"
    },
    saurieng: {
        name: "TRÁI SẦU RIÊNG",
        price: "300000đ",
        desc: "Sầu riêng được mệnh danh là vua của các loại trái cây nhờ hương thơm mạnh mẽ và hương vị béo ngậy độc đáo. Múi sầu riêng vàng óng, mềm mịn như kem, tan ngay trong miệng với vị ngọt đậm đà hòa quyện cùng độ béo tự nhiên. Mỗi múi đều mang đến trải nghiệm ẩm thực đặc biệt, thích hợp cho những người yêu thích hương vị phong phú và khác biệt của trái cây nhiệt đới cao cấp.",
        img: "../assets/images/saurieng.jpg"
    },
    cherry: {
        name: "TRÁI CHERRY",
        price: "400000đ",
        desc: "Cherry nổi bật với sắc đỏ ruby sang trọng, lớp vỏ mỏng bóng đẹp và phần thịt giòn mọng nước. Khi thưởng thức, vị ngọt thanh xen lẫn chút chua nhẹ tạo nên cảm giác tươi mới và cuốn hút. Cherry không chỉ hấp dẫn bởi hương vị tinh tế mà còn giàu chất chống oxy hóa, vitamin và khoáng chất, trở thành lựa chọn yêu thích trong phân khúc trái cây nhập khẩu cao cấp.",
        img: "../assets/images/cherry.jpg"
    },
    tao: {
        name: "TRÁI TÁO",
        price: "250000đ",
        desc: "Táo là loại trái cây quen thuộc với lớp vỏ căng bóng, màu sắc bắt mắt và phần thịt trắng ngà giòn ngọt. Mỗi miếng táo mang đến cảm giác tươi mát, mọng nước cùng hương thơm nhẹ nhàng tự nhiên. Giàu chất xơ, vitamin và các dưỡng chất thiết yếu, táo là lựa chọn lý tưởng cho bữa ăn nhẹ, giúp bổ sung năng lượng và duy trì chế độ dinh dưỡng cân bằng.",
        img: "../assets/images/tao.jpg"
    },
    nho: {
        name: "TRÁI NHO",
        price: "300000đ",
        desc: "Nho hấp dẫn với những chùm quả căng mọng, vỏ mỏng và vị ngọt đậm tự nhiên. Tùy từng giống, nho có thể mang hương vị thanh mát hoặc ngọt đậm, kết hợp cùng phần thịt mọng nước tạo cảm giác dễ chịu khi thưởng thức. Đây là loại trái cây được yêu thích nhờ hàm lượng chất chống oxy hóa cao, thích hợp để ăn tươi, làm món tráng miệng hoặc bổ sung dinh dưỡng hằng ngày.",
        img: "../assets/images/nho.jpg"
    },
    vietquoc: {
        name: "TRÁI VIỆT QUỐC",
        price: "350000đ",
        desc: "Việt quất là loại quả nhỏ xinh với màu xanh tím đặc trưng và lớp phấn trắng tự nhiên bên ngoài. Quả có vị ngọt dịu pha chút chua thanh, thịt mọng nước và hương thơm tinh tế. Được biết đến là một trong những loại trái cây giàu chất chống oxy hóa hàng đầu, việt quất thường được lựa chọn trong các chế độ ăn lành mạnh, giúp mang đến trải nghiệm vừa ngon miệng vừa bổ dưỡng.",
        img: "../assets/images/vietquoc.jpg"
    },
};

// lấy query ?id=
const params = new URLSearchParams(window.location.search);
const id = params.get("id");

// tìm sản phẩm
const p = products[id];

if (p) {
    document.getElementById("name").innerText = p.name;
    document.getElementById("price").innerText = p.price;
    document.getElementById("desc").innerText = p.desc;
    document.getElementById("img").src = p.img;
} else {
    document.body.innerHTML = "<h2>Không tìm thấy sản phẩm</h2>";
}
</script>

</body>
</html>
