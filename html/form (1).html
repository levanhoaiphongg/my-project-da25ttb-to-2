<!DOCTYPE html>
 <html lang="Vi">
	<head>
		<title>THIẾT KẾ FORM ĐĂNG NHẬP</title>
		<meta charset="utf-8">
		<link rel="stylesheet" href="../css/style01.css">
	</head>
	<body>
		<div class ="container">
		 <form id="frmLogin">
			<h2 id="title">Form Login</h2>
			<div class="form-group">
				<label for="txtUsername">Username:</label>
				<input class="form-control" type ="text" id="txtUsername" name="txtUsername">
			</div>
			<div class ="form-group">
				<label for="txtpassword">Password:</label>
				<input class="form-control" type ="password" id="txtpassword" name="txtpassword">
			</div>
				<input class ="button" type ="submit" id="sbLogin" name="sbLogin" value ="Login">
				<input class="button" type ="reset" id="rsCancle" name="rsCancle" value ="Cancel">
		 </form>
		</div>
	</body>
 </html>
